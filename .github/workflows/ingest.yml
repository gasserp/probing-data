name: ingest

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      probing_ref:
        description: "gasserp/probing ref to build probing-ingest from. Blank = deploy/VERSION on probing main."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: probing-data

      # The collector and this acceptance binary must agree on the batch wire
      # format, or every new batch is quarantined as invalid_envelope. Both
      # follow deploy/VERSION in gasserp/probing: its deploy workflow builds the
      # collector from that ref (and refuses refs whose format is newer than
      # what VERSION names), and this workflow builds probing-ingest from it.
      - uses: actions/checkout@v5
        with:
          repository: gasserp/probing
          ref: main
          path: probing-version
          sparse-checkout: deploy/VERSION
          sparse-checkout-cone-mode: false

      - name: Resolve probing ref
        id: probing
        env:
          INPUT_REF: ${{ inputs.probing_ref }}
        run: |
          set -eu
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="$(tr -d '[:space:]' < probing-version/deploy/VERSION)"
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$'; then
            echo "::error::Invalid probing ref '$ref'"
            exit 1
          fi
          case "$ref" in
            *..*|*/../*|*/) echo "::error::Invalid probing ref '$ref'"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: gasserp/probing
          ref: ${{ steps.probing.outputs.ref }}
          path: probing

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build probing-ingest and probing-fetch
        working-directory: probing
        env:
          PROBING_REF: ${{ steps.probing.outputs.ref }}
        run: |
          set -eu
          echo "Building probing-ingest from gasserp/probing@$(git rev-parse HEAD) ($PROBING_REF)"
          go build -o ../probing-ingest ./cmd/probing-ingest
          # Refs older than contributor-hosted batches have no fetcher.
          if [ -d cmd/probing-fetch ]; then
            go build -o ../probing-fetch ./cmd/probing-fetch
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download pending batches
        run: |
          set -eu
          mkdir -p pending
          az storage blob download-batch \
            --account-name "${{ vars.PROBING_STORAGE_ACCOUNT }}" \
            --source "${{ vars.PROBING_STORAGE_CONTAINER }}" \
            --destination pending \
            --auth-mode login \
            --pattern "*.json" \
            --only-show-errors || echo "no pending blobs"
          # Only these may be deleted from the container after acceptance.
          find pending -type f -name '*.json' -printf '%P\n' | LC_ALL=C sort > azure-blobs.txt

      # Contributors publish signed batches to their own public GitHub
      # repositories (registry field github_repository). The token only lifts
      # the API rate limit; the repositories are read anonymously otherwise.
      - name: Fetch contributor batches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ ! -x ./probing-fetch ]; then
            echo "probing ref has no probing-fetch; skipping contributor repositories"
            exit 0
          fi
          ./probing-fetch \
            -repo=probing-data \
            -output=pending \
            -repository=gasserp/probing-data

      - name: Run acceptance and rollup
        run: |
          set -eu
          rc=0
          ./probing-ingest \
            -repo=probing-data \
            -input=pending \
            -repository=gasserp/probing-data \
            -accepted-manifest=accepted-manifest.json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

      - name: Commit accepted rollups
        working-directory: probing-data
        run: |
          set -eu
          git config user.name "probing-data ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Ingest accepted batches"
            git push
          fi

      - name: Delete accepted and replayed blobs
        run: |
          set -eu
          jq -r '.blobs[]' accepted-manifest.json | LC_ALL=C sort |
            LC_ALL=C comm -12 - azure-blobs.txt | while IFS= read -r blob; do
            az storage blob delete \
              --account-name "${{ vars.PROBING_STORAGE_ACCOUNT }}" \
              --container-name "${{ vars.PROBING_STORAGE_CONTAINER }}" \
              --name "$blob" \
              --auth-mode login \
              --only-show-errors
          done
